<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniRank - University Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo-icon">🎓</div>
                <h1>UniRank</h1>
            </div>

            <div class="card">
                <h2>Filters</h2>
                <div class="form-group">
                    <label for="country-filter">Include Countries</label>
                    <div id="country-tags" class="tag-list" style="margin-bottom: 8px;"></div>
                    <select id="country-filter">
                        <option value="">+ Add Country to Include</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="country-exclude-filter">Exclude Countries</label>
                    <div id="country-exclude-tags" class="tag-list" style="margin-bottom: 8px;"></div>
                    <select id="country-exclude-filter">
                        <option value="">+ Add Country to Exclude</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="city-filter">City</label>
                    <select id="city-filter">
                        <option value="All">All Cities</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Keywords</label>
                    <div id="keyword-tags" class="tag-list" style="margin-bottom: 8px;"></div>
                    <select id="keyword-filter">
                        <option value="">+ Add Keyword</option>
                    </select>
                    <input type="text" id="search-input" placeholder="Or type manual search..." style="margin-top: 8px;">
                </div>
                <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px; margin-top: 16px; margin-bottom: 8px;">
                    <input type="checkbox" id="fav-filter" style="width: auto; cursor: pointer;">
                    <label for="fav-filter" style="margin: 0; cursor: pointer; color: var(--text-highlight); font-weight: 600;">⭐ Show Favorites</label>
                </div>
            </div>

            <div class="card">
                <h2>Ranking Weights</h2>
                <div class="weight-sliders">
                    <div class="slider-group">
                        <label>Cost (↓) <span id="val-cost">0.30</span></label>
                        <input type="range" id="w-cost" min="0" max="1" step="0.01" value="0.30">
                    </div>
                    <div class="slider-group">
                        <label>Tuition Fee (↓) <span id="val-tuition">0.20</span></label>
                        <input type="range" id="w-tuition" min="0" max="1" step="0.01" value="0.20">
                    </div>
                    <div class="slider-group" style="display: none;">
                        <label>Focus Fit (↑) <span id="val-fit">0.40</span></label>
                        <input type="range" id="w-fit" min="0" max="1" step="0.01" value="0.40">
                    </div>
                    <div class="slider-group">
                        <label>Pros Bonus (↑) <span id="val-pros">0.07</span></label>
                        <input type="range" id="w-pros" min="0" max="1" step="0.01" value="0.07">
                    </div>
                    <div class="slider-group">
                        <label>Cons Penalty (↓) <span id="val-cons">0.03</span></label>
                        <input type="range" id="w-cons" min="0" max="1" step="0.01" value="0.03">
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Sorting</h2>
                <div class="form-group">
                    <select id="sort-select">
                        <option value="score_desc">Score (High → Low)</option>
                        <option value="tuition_asc">Tuition Fee (Low → High)</option>
                        <option value="cost_asc">Cost (Low → High)</option>
                        <option value="name_asc">University (A → Z)</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-titles">
                    <h2>University Ranking Dashboard</h2>
                    <p>Analyze and compare universities based on your personal criteria</p>
                </div>
            </header>

            <div class="kpi-container">
                <div class="kpi-card">
                    <div class="kpi-icon">🏛️</div>
                    <div class="kpi-data">
                        <span class="kpi-label">Total Schools</span>
                        <span class="kpi-value" id="kpi-total">0</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon">💰</div>
                    <div class="kpi-data">
                        <span class="kpi-label">Avg. Tuition Fee</span>
                        <span class="kpi-value" id="kpi-tuition">0€</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon">⭐</div>
                    <div class="kpi-data">
                        <span class="kpi-label">Avg. Score</span>
                        <span class="kpi-value" id="kpi-score">0.0</span>
                    </div>
                </div>
            </div>

            <div class="table-card">
                <div class="table-header">
                    <h3>Ranked Results</h3>
                    <div class="loader" id="loader"></div>
                </div>
                <div class="table-responsive">
                    <table id="results-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Fav</th>
                                <th>University</th>
                                <th>City</th>
                                <th>Country</th>
                                <th>Score</th>
                                <th>Tuition (Yearly)</th>
                                <th>Detail</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Rows rendered via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Detail Drawer -->
        <div class="drawer-overlay" id="drawer-overlay"></div>
        <aside class="drawer" id="detail-drawer">
            <div class="drawer-header">
                <h2 id="drawer-title">University Name</h2>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <button id="drawer-fav-btn" style="background: none; border: none; font-size: 24px; cursor: pointer;">☆</button>
                    <button class="close-btn" id="drawer-close">&times;</button>
                </div>
            </div>
            <div class="drawer-content" id="drawer-body">
                <div class="radar-container" style="position: relative; width: 100%; height: 300px; display: flex; justify-content: center; margin-bottom: 24px;">
                    <canvas id="radarChart"></canvas>
                </div>
                <div id="drawer-info"></div>
            </div>
        </aside>
    </div>
    
    <!-- Using a mock/local JSON or API depending on deployment -->
    <script src="script.js"></script>
</body>
</html>
