[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unirank"
version = "1.0.0"
description = "A professional dashboard application for ranking universities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0"
]

[tool.setuptools]
packages = ["unirank"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "pyinstaller"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.black]
line-length = 120
target-version = ["py310"]
